name: Secret scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false

      - name: Check out pull request
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Scan for high-confidence secrets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            python3 base/.github/scripts/check_secrets.py pr
          else
            python3 base/.github/scripts/check_secrets.py base
          fi

      - name: Test the secret scanner
        run: python3 base/.github/scripts/test_check_secrets.py
